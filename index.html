<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ni buat si cantik ku</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* CSS Tema Pink Singkat agar langsung jalan */
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #ffdde1; font-family: sans-serif; overflow: hidden; }
    .bg { text-align: center; }
    .pesan img { width: 130px; cursor: pointer; }
    .content { display: none; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); flex-direction: column; align-items: center; width: 280px; }
    .content img { width: 150px; border-radius: 10px; }
    .kata { font-weight: bold; color: #d81b60; margin: 15px 0; }
    button { padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .iya { background: #ff4081; color: white; }
    .enggak { background: #eee; color: #777; position: absolute; }
  </style>
</head>
<body onmouseover="fullLayar()">
  <audio src="lagu.mp3" id="lagu"></audio>

  <div class="bg">
    <div class="pesan" onclick="pesanHilang()">
      <img src="pesan.png" alt="Pesan">
      <span>klik</span>
    </div>

    <div class="content">
      <img src="kaku.webp" alt="Stiker" class="kado">
      <p class="kata"></p>
      <div class="btn-group">
        <button class="iya" onclick="clik(this)">Iya 🤗</button>
        <button class="enggak" id="btnEnggak" onclick="clik(this)">Enggak 🤪</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
