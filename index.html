<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special for Incess ✨</title>
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #ffdde1; font-family: Arial, sans-serif; overflow: hidden; }
    .bg { text-align: center; }
    .pesan img { width: 130px; cursor: pointer; animation: bounce 1.5s infinite; }
    .content { display: none; background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); flex-direction: column; align-items: center; width: 280px; }
    .content img { width: 150px; border-radius: 15px; }
    .kata { font-weight: bold; color: #d81b60; margin: 20px 0; }
    button { padding: 12px 25px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
    .iya { background: #ff4081; color: white; }
    .enggak { background: #fce4ec; color: #ad1457; position: absolute; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>
</head>
<body onmouseover="fullLayar()">
  <audio src="lagu.mp3" id="lagu"></audio>
  <div class="bg">
    <div class="pesan" onclick="pesanHilang()">
      <img src="pesan.png" alt="Pesan">
      <span>Klik untuk membuka pesan ✨</span>
    </div>
    <div class="content">
      <img src="kaku.webp" alt="Stiker" class="kado">
      <p class="kata"></p>
      <div class="btn-group">
        <button class="iya" onclick="clik(this)">Iya 🤗</button>
        <button class="enggak" id="btnEnggak" onclick="clik(this)">Enggak 🤪</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
